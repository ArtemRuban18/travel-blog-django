{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'user/css/auth_forms.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <h2>Password Reset</h2>
    <p>Enter your email address to receive a password reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>
    <p><a href="{% url 'user:login' %}">Back to login</a></p>
{% endblock %}
