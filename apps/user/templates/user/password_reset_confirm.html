{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'user/css/auth_forms.css' %}">
{% endblock %}
{% block content %}
    <h2>Set a new password</h2>

    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Change password</button>
    </form>
    {% else %}
    <p>
        The password reset link is invalid or has expired.
    </p>
    {% endif %}
{% endblock %}
